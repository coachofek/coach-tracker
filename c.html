<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מעקב שקילות — Coach Ofek</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --card:#12294d; --card2:#0f2244; --gold:#d4af37; --gold-soft:#e6c964;
    --ink:#eaf1fb; --muted:#9db2d4; --line:rgba(212,175,55,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%, #123057 0%, #0a1a33 55%, #071223 100%);
    color:var(--ink); min-height:100vh; direction:rtl; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:30px 18px 60px}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
  .brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#b8912b);
    display:flex;align-items:center;justify-content:center;color:#0a1a33;font-weight:800;font-size:20px;
    box-shadow:0 6px 18px rgba(212,175,55,.3)}
  .brand .name{font-weight:800;letter-spacing:.4px;font-size:15px;color:var(--gold-soft)}
  h1{font-size:27px;font-weight:800;text-align:center;margin:6px 0 2px}
  .sub{text-align:center;color:var(--muted);font-size:15px;margin:0 0 22px}
  .live{display:inline-flex;align-items:center;gap:7px;color:#8fe3bd;font-size:13px;font-weight:700}
  .dot{width:9px;height:9px;border-radius:50%;background:#3ad08a;box-shadow:0 0 0 0 rgba(58,208,138,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,208,138,.55)}70%{box-shadow:0 0 0 10px rgba(58,208,138,0)}100%{box-shadow:0 0 0 0 rgba(58,208,138,0)}}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}
  .stat .v{font-size:23px;font-weight:800;color:var(--gold-soft)}
  .stat .k{font-size:12px;color:var(--muted);margin-top:3px}
  .chartcard{margin-bottom:16px;display:none}
  .chart-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .chart-h b{font-size:15px}
  svg{display:block;width:100%;height:auto}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{color:var(--gold-soft);font-weight:700;text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}
  td{padding:14px 10px;border-bottom:1px solid rgba(157,178,212,.12);text-align:right}
  tr:last-child td{border-bottom:none}
  .wt{font-weight:800;color:#fff}
  .feel{display:inline-block;padding:4px 11px;border-radius:999px;background:rgba(212,175,55,.12);
    border:1px solid var(--line);color:var(--gold-soft);font-size:13px;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">O</div><div class="name">COACH OFEK</div></div>
  <h1>מעקב שקילות</h1>
  <p class="sub"><span id="who">&nbsp;</span> &nbsp;·&nbsp; <span class="live"><span class="dot"></span>מתעדכן בזמן אמת</span></p>
  <div class="stats">
    <div class="stat"><div class="v" id="s-last">—</div><div class="k">שקילה אחרונה</div></div>
    <div class="stat"><div class="v" id="s-change">—</div><div class="k">שינוי מהתחלה</div></div>
    <div class="stat"><div class="v" id="s-count">—</div><div class="k">סה"כ שקילות</div></div>
  </div>
  <div class="card chartcard" id="chartcard">
    <div class="chart-h"><b>מגמת משקל</b><span style="color:var(--muted);font-size:13px">ק"ג לאורך זמן</span></div>
    <div id="chart"></div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>תאריך</th><th>שעה</th><th>משקל</th><th>איך מרגישה</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">טוען…</td></tr></tbody>
    </table>
  </div>
  <p class="foot">העמוד מתרענן אוטומטית כל כמה שניות</p>
</div>
<script>
  var API='https://xcvqxvokkqrvdtwoiyen.supabase.co/functions/v1/weighin';
  var SLUG=new URLSearchParams(location.search).get('k')||'';
  function fmtDate(iso){var d=new Date(iso);return d.toLocaleDateString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'numeric'});}
  function fmtTime(iso){var d=new Date(iso);return d.toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});}
  function num(n){return Number(n).toFixed(2);}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function render(data){
    if(data && data.client_name){document.getElementById('who').textContent=data.client_name;}
    var rows=(data&&data.rows)||[];
    var tb=document.getElementById('rows');
    if(rows.length===0){
      tb.innerHTML='<tr><td colspan="4" class="empty">עדיין אין שקילות</td></tr>';
      document.getElementById('s-last').textContent='—';
      document.getElementById('s-change').textContent='—';
      document.getElementById('s-count').textContent='0';
      document.getElementById('chartcard').style.display='none';
      return;
    }
    var html='';
    for(var i=0;i<rows.length;i++){var r=rows[i];
      html+='<tr><td>'+fmtDate(r.recorded_at)+'</td><td>'+fmtTime(r.recorded_at)+'</td><td class="wt">'+num(r.weight)+'</td><td><span class="feel">'+esc(r.feeling)+'</span></td></tr>';}
    tb.innerHTML=html;
    document.getElementById('s-last').textContent=num(rows[0].weight);
    document.getElementById('s-count').textContent=rows.length;
    var first=Number(rows[rows.length-1].weight), last=Number(rows[0].weight);
    var diff=last-first; var sign=diff>0?'+':''; var el=document.getElementById('s-change');
    el.textContent=(rows.length>1)?(sign+diff.toFixed(2)):'—';
    el.style.color=diff<0?'#8fe3bd':(diff>0?'#f2b3a3':'var(--gold-soft)');
    drawChart(rows.slice().reverse());
  }
  function drawChart(rows){
    var card=document.getElementById('chartcard');
    if(rows.length<2){card.style.display='none';return;} card.style.display='block';
    var W=680,H=220,pad=34;
    var ys=rows.map(function(r){return Number(r.weight);});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    if(min===max){min-=1;max+=1;}
    var range=max-min;
    function X(i){return pad+(W-2*pad)*(rows.length===1?0.5:i/(rows.length-1));}
    function Y(v){return pad+(H-2*pad)*(1-(v-min)/range);}
    var d='',pts='';
    for(var i=0;i<rows.length;i++){var x=X(i),y=Y(ys[i]);d+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';
      pts+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="#d4af37" stroke="#0a1a33" stroke-width="2"></circle>';}
    var area=d+'L'+X(rows.length-1).toFixed(1)+' '+(H-pad)+' L'+X(0).toFixed(1)+' '+(H-pad)+' Z';
    var svg='<svg viewBox="0 0 '+W+' '+H+'">';
    svg+='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4af37" stop-opacity=".35"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>';
    svg+='<path d="'+area+'" fill="url(#g)"></path>';
    svg+='<path d="'+d+'" fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>';
    svg+='<text x="'+(W-pad)+'" y="16" fill="#9db2d4" font-size="13" text-anchor="end">'+num(max)+'</text>';
    svg+='<text x="'+(W-pad)+'" y="'+(H-6)+'" fill="#9db2d4" font-size="13" text-anchor="end">'+num(min)+'</text>';
    svg+=pts+'</svg>';
    document.getElementById('chart').innerHTML=svg;
  }
  function load(){
    if(!SLUG){document.getElementById('rows').innerHTML='<tr><td colspan="4" class="empty">הקישור אינו תקין</td></tr>';return;}
    fetch(API+'?action=list&slug='+encodeURIComponent(SLUG)).then(function(r){return r.json();}).then(render).catch(function(){});
  }
  load(); setInterval(load,7000);
</script>
</body>
</html>
